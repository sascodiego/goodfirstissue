{{define "add-repo"}}<form class="add" method="post" action="/repos" data-busy aria-label="Agregar repositorio">
      <label for="nuevo">Agregar repositorio</label>
      <div class="add-row">
        <input id="nuevo" name="nuevo" type="text" placeholder="owner/nombre o enlace de GitHub"
               autocomplete="off" spellcheck="false" required>
        <button type="submit" aria-label="Agregar repositorio">+</button>
      </div>
      <p>
        Acepta <code>owner/nombre</code> o el enlace completo.<br>
        El nombre canónico lo dice GitHub: si el repositorio se renombró, se guarda el
        nuevo. Trae hasta 150 issues <code>OPEN</code> con sus etiquetas verbatim, sin
        filtrar por etiqueta.
      </p>
      <p class="busy" hidden>Trayendo el repositorio. Tarda unos segundos; no cierres.</p>
    </form>{{end}}
